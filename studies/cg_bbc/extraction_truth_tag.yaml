schema_version: 2
name: cg_bbc_truth_tag
tree: Delphes
units:
  momentum: GeV
  angle: radians
  cross_section: pb
collections:
  jets:
    fields:
      pt:
        branch: Jet/Jet.PT
        dtype: float32
      eta:
        branch: Jet/Jet.Eta
        dtype: float32
      phi:
        branch: Jet/Jet.Phi
        dtype: float32
      mass:
        branch: Jet/Jet.Mass
        dtype: float32
      btag:
        branch: Jet/Jet.BTag
        dtype: int32
      deta:
        branch: Jet/Jet.DeltaEta
        dtype: float32
      dphi:
        branch: Jet/Jet.DeltaPhi
        dtype: float32
      ehad_eem:
        branch: Jet/Jet.EhadOverEem
        dtype: float32
      truth_flavor:
        branch: Jet/Jet.Flavor
        dtype: int32
        truth: true
event_fields:
  weight:
    branch: Event/Event.Weight
    dtype: float32
    reduce: first
    required: false
    default: 1.0
  xs:
    branch: Event/Event.CrossSection
    dtype: float32
    reduce: first
    required: false
    default: 1.0
  event_number:
    branch: Event/Event.Number
    dtype: int64
    reduce: first
  met:
    branch: MissingET/MissingET.MET
    dtype: float32
    reduce: first
  met_phi:
    branch: MissingET/MissingET.Phi
    dtype: float32
    reduce: first
  ht_all:
    branch: ScalarHT/ScalarHT.HT
    dtype: float32
    reduce: first
  n_electrons:
    branch: Electron_size
    dtype: int32
  n_muons:
    branch: Muon_size
    dtype: int32
  n_photons:
    branch: Photon_size
    dtype: int32
  truth_lhe_weights:
    branch: Weight/Weight.Weight
    dtype: float32
    reduce: list
    truth: true
    accumulate: ratio_to_first
selection:
  jets_in_acceptance:
    collection: jets
    filters:
      pt:
        gt: 25.0
      eta:
        abs_lt: 2.5
    count:
      min: 3
