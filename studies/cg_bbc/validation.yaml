binned_fit_study:
  stage: A
  observable: closest_cb_mass
  jets: calibrated
  calibration:
    coupling: 0.4
    match_delta_r: 0.4
    pt_edges:
    - 25
    - 35
    - 45
    - 60
    - 80
    - 100
    - 130
    - 170
    - 220
    - 300
    - 400
    statistic: median_parton_over_reco_pt
    interpolation: linear_in_log_pt_between_bin_medians
  binning:
    x_min: 0.3
    x_max: 2.0
    log_step: 0.1
    min_background_neff: 10
  normalization_uncertainty: 0.05
  shape_uncertainties:
  - 0.01
  - 0.02
  - 0.05
  primary_shape_uncertainty: 0.02
  mc_statistics: background_sum_w2_per_bin
  closure_tolerance: 0.01
binned_fit_stage_b:
  stage: B
  model_seed: 42
  category_background_efficiencies:
  - 0.5
  - 0.2
  - 0.05
  observable: closest_cb_mass
  jets: reconstructed
  templates: validation
  closure: one_bin_above_the_grid_threshold_reproduces_its_Z_syst_5pct
  descriptive:
  - infinite_mc
  - single_category
  - categories_only
truth_tagging:
  recipe: extraction_truth_tag.yaml
  acceptance:
    pt_gt: 25.0
    abs_eta_lt: 2.5
  flavour:
    column: jets_truth_flavor
    b: 5
    c: 4
  efficiencies:
    b_tag:
      bit_value: 1
      b: 0.80*tanh(0.003*pt)*(30/(1+0.086*pt))
      c: 0.20*tanh(0.02*pt)*(1/(1+0.0034*pt))
      default: 0.002+7.3e-06*pt
    c_tag:
      bit_value: 16
      b: '0.01'
      c: '0.22'
      default: '0.001'
  jet_states:
    b_only: eps_b*(1-eps_c)
    c_only: eps_c*(1-eps_b)
    neither_or_both: (1-eps_b)*(1-eps_c)+eps_b*eps_c
  roles: b1_b2_by_descending_pt_c1_the_c_only_jet
  splits: by_event_registry_extension
  mc_variance: sum_entries_per_event_then_square
  closure:
    export_consistency: exact_event_ids_and_jets_every_sample
    tag_rates:
      pt_edges:
      - 25
      - 30
      - 40
      - 50
      - 60
      - 80
      - 100
      - 130
      - 170
      - 250
      - 400
      min_expected: 10
      min_p_value: 0.001
    yield_max_abs_pull: 3.0
    shapes:
      primary_sample: bkg_bbc
      bins: 10
      min_p_value: 0.001
truth_tag_rerun:
  closure_report: truth-tag-closure-v1
  rows: one_sampled_outcome_per_event
