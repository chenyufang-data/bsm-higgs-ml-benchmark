reference_study:
  masses:
  - 200
  - 400
  fit_policy: none
  seeds:
  - 42
  - 7
  - 123
  bootstrap_replicates: 200
  bootstrap_seed: 2026
  cut_reference:
    mass_features:
    - mcb1
    - mcb2
    activity_feature: ht
    relative_half_widths:
    - 0.15
    - 0.25
    - 0.35
    - 0.5
    minimum_activity_over_mass:
    - 0.0
    - 0.75
    - 1.0
grid_study:
  masses:
  - 200
  - 400
  fit_policy: none
  seeds:
  - 42
  - 7
  - 123
  primary_seed: 42
  registry_seed: 42
  bootstrap_replicates: 200
  bootstrap_seed: 2026
truth_tagging:
  recipe: extraction_truth_tag.yaml
  acceptance:
    pt_gt: 25.0
    abs_eta_lt: 2.5
  flavour:
    column: jets_truth_flavor
    b: 5
    c: 4
  efficiencies:
    b_tag:
      bit_value: 1
      b: 0.80*tanh(0.003*pt)*(30/(1+0.086*pt))
      c: 0.20*tanh(0.02*pt)*(1/(1+0.0034*pt))
      default: 0.002+7.3e-06*pt
    c_tag:
      bit_value: 16
      b: '0.01'
      c: '0.22'
      default: '0.001'
  jet_states:
    b_only: eps_b*(1-eps_c)
    c_only: eps_c*(1-eps_b)
    neither_or_both: (1-eps_b)*(1-eps_c)+eps_b*eps_c
  roles: b1_b2_by_descending_pt_c1_the_c_only_jet
  splits: by_event_registry_extension
  mc_variance: sum_entries_per_event_then_square
  closure:
    export_consistency: exact_event_ids_and_jets_every_sample
    tag_rates:
      pt_edges:
      - 25
      - 30
      - 40
      - 50
      - 60
      - 80
      - 100
      - 130
      - 170
      - 250
      - 400
      min_expected: 10
      min_p_value: 0.001
    yield_max_abs_pull: 3.0
    shapes:
      primary_sample: bkg_bbj
      bins: 10
      min_p_value: 0.001
jet_network_pilot:
  grid_report: grid-v1
  masses:
  - 200
  - 400
  seeds:
  - 42
  - 7
  - 123
  nodes:
    jets:
    - b1
    - b2
    - c1
    beams: true
    momentum_unit_gev: 100.0
  fit_weight: pass_probability
  models:
    lorentznet:
      hidden: 72
      blocks: 6
      c_weight: 0.001
      dropout: 0.2
    deep_sets:
      hidden: 72
      layers: 3
      dropout: 0.2
  training:
    optimizer: adamw
    learning_rate: 0.001
    weight_decay: 0.01
    batch_size: 512
    max_epochs: 60
    schedule: cosine
    patience: 10
  checkpoint: best_fit_weighted_validation_auc
  primary:
    metric: weighted_validation_auc
    compare: lorentznet
    bootstrap_replicates: 1000
    bootstrap_seed: 2029
    interval: 0.95
  descriptive_signal_efficiencies:
  - 0.3
  - 0.5
particle_transformer_pilot:
  grid_report: grid-v1
  lorentznet_report: lorentznet-v1
  masses:
  - 200
  - 400
  seeds:
  - 42
  - 7
  - 123
  nodes:
    jets:
    - b1
    - b2
    - c1
    beams: false
    momentum_unit_gev: 100.0
  token_features:
  - log_pt
  - eta
  - log_energy
  - role
  pair_features:
  - ln_kt
  - ln_z
  - ln_delta_r
  - ln_m2
  fit_weight: pass_probability
  implementation:
    package: weaver-core
    version: 0.4.17
  models:
    particle_transformer:
      embed_dims:
      - 128
      - 512
      - 128
      pair_embed_dims:
      - 64
      - 64
      - 64
      num_heads: 8
      num_layers: 8
      num_cls_layers: 2
      trim: false
  training:
    optimizer: adamw
    learning_rate: 0.001
    weight_decay: 0.01
    batch_size: 512
    max_epochs: 60
    schedule: cosine
    patience: 10
  checkpoint: best_fit_weighted_validation_auc
  primary:
    metric: weighted_validation_auc
    compare: particle_transformer
    bootstrap_replicates: 1000
    bootstrap_seed: 2030
    interval: 0.95
  secondary:
    against: lorentznet
  descriptive_signal_efficiencies:
  - 0.3
  - 0.5
